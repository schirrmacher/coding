default = "orca"

[net]
subnet = "10.77.0.0/24"

[proxy]
sni_port = 3128
dns_port = 53

[[apps]]
name = "orca"
cmd = [
    "${HOME}/Applications/orca-linux.AppImage",
]
gui = true
dir.write = [
    "${HOME}/orca",
    "${HOME}/.orca",
    "${HOME}/.config/orca",
    "${HOME}/.cache/orca",
]
endpoints = [
    "cortecs.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[[apps]]
name = "claude"
endpoints = [
    "api.anthropic.com",
    "claude.ai",
    "claude.com",
    "platform.claude.com",
]

[[apps]]
name = "codex"
env.GH_CONFIG_DIR = "${HOME}/.local/share/sandbox/gh"
env.GH_NO_UPDATE_NOTIFIER = "1"
env.CARGO_HOME = "${HOME}/.local/share/sandbox/cargo"
env.RUSTUP_HOME = "${HOME}/.rustup"
env.RUSTUP_AUTO_INSTALL = "0"
env.CARGO_REGISTRIES_CRATES_IO_PROTOCOL = "sparse"
env.UV_CACHE_DIR = "${HOME}/.local/share/sandbox/uv/cache"
env.UV_PYTHON_INSTALL_DIR = "${HOME}/.local/share/sandbox/uv/python"
env.UV_PYTHON_BIN_DIR = "${HOME}/.local/share/sandbox/uv/python-bin"
env.UV_TOOL_DIR = "${HOME}/.local/share/sandbox/uv/tools"
env.UV_TOOL_BIN_DIR = "${HOME}/.local/share/sandbox/uv/bin"
env.UV_NO_MODIFY_PATH = "1"
env.PATH = "${HOME}/.cargo/bin:${HOME}/.local/share/sandbox/cargo/bin:${HOME}/.local/share/sandbox/runtimes/uv:${HOME}/.local/share/sandbox/uv/bin:${HOME}/.local/share/sandbox/uv/python-bin:${HOME}/.local/share/sandbox/runtimes/sigrid:/usr/local/bin:/usr/bin:/bin"
sigrid = true
cmd = ["${HOME}/.local/share/codex/current/bin/codex"]

codex_home = "${HOME}/.codex"
dir.read = [
    "${HOME}/.agents",
    "${HOME}/.orca/agent-hooks",
    "${HOME}/.local/share/codex",
    "${HOME}/.cargo/bin",
    "${HOME}/.rustup",
    "${HOME}/.local/share/sandbox/runtimes/uv",
    "${HOME}/.local/share/sigrid",
    "${HOME}/.local/share/sandbox/runtimes/sigrid",
    "/usr/include",
    "/usr/libexec/gcc",
]
dir.state = [
    "${HOME}/.local/share/sandbox/gh",
    "${HOME}/.local/share/sandbox/cargo",
    "${HOME}/.local/share/sandbox/uv",
    "${HOME}/.config/sigrid",
]
endpoints = [
    "github.com",
    "api.github.com",
    "api.openai.com",
    "chatgpt.com",
    "auth.openai.com",
    "index.crates.io",
    "static.crates.io",
    "crates.io",
    "pypi.org",
    "files.pythonhosted.org",
    "release-assets.githubusercontent.com",
]

[[apps]]
name = "vscode"
env.VSCODE_PORTABLE = "${HOME}/.local/share/sandbox/vscode"
wrapper_name = "code"
cmd = ["/usr/bin/code", "--wait", "--no-sandbox", "--user-data-dir", "${HOME}/.local/share/sandbox/vscode/user-data", "--extensions-dir", "${HOME}/.local/share/sandbox/vscode/extensions"]
gui = true
launchers = [
    "com.microsoft.VSCode.desktop",
    "com.microsoft.VSCode.UrlHandler.desktop",
]
dir.write = ["${HOME}/.local/share/sandbox/vscode"]
dir.read = [
    "/usr/share/code",
]
endpoints = [
    "update.code.visualstudio.com",
    "marketplace.visualstudio.com",
    "vscode.download.prss.microsoft.com",
]

[[apps]]
name = "opencode"
env.GH_CONFIG_DIR = "${HOME}/.local/share/sandbox/gh"
env.GH_NO_UPDATE_NOTIFIER = "1"
env.PATH = "${HOME}/.local/share/sandbox/runtimes/sigrid:/usr/local/bin:/usr/bin:/bin"
env.OPENCODE_DISABLE_AUTOUPDATE = "1"
env.OPENCODE_DISABLE_MODELS_FETCH = "1"
env.OPENCODE_DISABLE_CLAUDE_CODE_SKILLS = "1"
sigrid = true
cmd = ["${HOME}/.opencode/bin/opencode"]
dir.write = ["${HOME}/.config/opencode", "${HOME}/.local/share/opencode", "${HOME}/.local/state/opencode", "${HOME}/.cache/opencode"]
dir.read = ["${HOME}/.opencode", "${HOME}/.agents", "${HOME}/.local/share/sigrid", "${HOME}/.local/share/sandbox/runtimes/sigrid"]
dir.state = ["${HOME}/.local/share/sandbox/gh", "${HOME}/.config/sigrid"]
endpoints = [
    "github.com",
    "api.github.com",
    "cortecs.ai",
    "api.cortecs.ai",
    "api.exa.ai",
    "api.mistral.ai",
]

[[apps]]
name = "gh"
env.GH_CONFIG_DIR = "${HOME}/.local/share/sandbox/gh"
env.GH_NO_UPDATE_NOTIFIER = "1"
cmd = ["/usr/bin/gh"]
dir.state = ["${HOME}/.local/share/sandbox/gh"]
endpoints = ["github.com", "api.github.com"]

[[apps]]
name = "cargo"
env.CARGO_HOME = "${HOME}/.local/share/sandbox/cargo"
env.RUSTUP_HOME = "${HOME}/.rustup"
env.RUSTUP_AUTO_INSTALL = "0"
env.CARGO_REGISTRIES_CRATES_IO_PROTOCOL = "sparse"
env.PATH = "${HOME}/.cargo/bin:${HOME}/.local/share/sandbox/cargo/bin:/usr/local/bin:/usr/bin:/bin"
cmd = ["${HOME}/.cargo/bin/cargo"]

dir.state = ["${HOME}/.local/share/sandbox/cargo"]
dir.read = ["${HOME}/.cargo/bin", "${HOME}/.rustup", "/usr/include", "/usr/libexec/gcc"]
endpoints = ["index.crates.io", "static.crates.io", "crates.io"]

[[apps]]
name = "uv"
env.UV_CACHE_DIR = "${HOME}/.local/share/sandbox/uv/cache"
env.UV_PYTHON_INSTALL_DIR = "${HOME}/.local/share/sandbox/uv/python"
env.UV_PYTHON_BIN_DIR = "${HOME}/.local/share/sandbox/uv/python-bin"
env.UV_TOOL_DIR = "${HOME}/.local/share/sandbox/uv/tools"
env.UV_TOOL_BIN_DIR = "${HOME}/.local/share/sandbox/uv/bin"
env.XDG_CONFIG_HOME = "${HOME}/.local/share/sandbox/uv/config"
env.XDG_DATA_HOME = "${HOME}/.local/share/sandbox/uv/data"
env.UV_NO_MODIFY_PATH = "1"
env.PATH = "${HOME}/.local/share/sandbox/runtimes/uv:${HOME}/.local/share/sandbox/uv/bin:${HOME}/.local/share/sandbox/uv/python-bin:/usr/local/bin:/usr/bin:/bin"
cmd = ["${HOME}/.local/share/sandbox/runtimes/uv/uv"]

dir.state = ["${HOME}/.local/share/sandbox/uv"]
dir.read = ["${HOME}/.local/share/sandbox/runtimes/uv"]
endpoints = ["pypi.org", "files.pythonhosted.org", "github.com", "release-assets.githubusercontent.com"]

[[apps]]
name = "photocraft"
desktop.enabled = true
desktop.id = "ai.storyteller.photocraft.desktop"
desktop.name = "PhotoCraft"
desktop.icon = "${HOME}/.local/share/icons/hicolor/256x256/apps/ai.storyteller.photocraft.png"
desktop.window_class = "photocraft"
desktop.terminal = false
env.PHOTOCRAFT_NO_DESKTOP_INTEGRATION = "1"
cmd = ["${HOME}/Applications/photocraft-linux.AppImage"]
gui = true
dir.write = ["${HOME}"]
endpoints = []

[[apps]]
name = "vectorcraft"
desktop.enabled = true
desktop.id = "ai.storyteller.vectorcraft.desktop"
desktop.name = "VectorCraft"
desktop.icon = "${HOME}/.local/share/icons/hicolor/256x256/apps/ai.storyteller.vectorcraft.png"
desktop.window_class = "ai.storyteller.vectorcraft"
desktop.terminal = false
cmd = ["${HOME}/Applications/vectorcraft-linux.AppImage"]
gui = true
dir.write = ["${HOME}"]
endpoints = []

[[apps]]
name = "designcraft"
desktop.enabled = true
desktop.id = "ai.storyteller.designcraft.desktop"
desktop.name = "DesignCraft"
desktop.icon = "${HOME}/.local/share/icons/hicolor/256x256/apps/ai.storyteller.designcraft.png"
desktop.window_class = "ai.storyteller.designcraft"
desktop.terminal = false
cmd = ["${HOME}/Applications/designcraft-linux.AppImage"]
gui = true
dir.write = ["${HOME}"]
endpoints = []

[[apps]]
name = "vibe"
browser = true
env.BROWSER = "${HOME}/.local/share/sandbox/runtimes/browser/xdg-open"
env.VIBE_HOME = "${HOME}/.vibe"
env.GH_CONFIG_DIR = "${HOME}/.local/share/sandbox/gh"
env.GH_NO_UPDATE_NOTIFIER = "1"
env.PATH = "${HOME}/.local/share/sandbox/runtimes/browser:${HOME}/.local/share/sandbox/runtimes/sigrid:/usr/local/bin:/usr/bin:/bin"
sigrid = true
cmd = ["${HOME}/.local/share/mistral-vibe/bin/vibe"]
dir.read = ["${HOME}/.local/share/sandbox/runtimes/browser", "${HOME}/.local/share/mistral-vibe", "${HOME}/.agents", "${HOME}/.local/share/sigrid", "${HOME}/.local/share/sandbox/runtimes/sigrid"]
dir.state = ["${HOME}/.vibe", "${HOME}/.local/share/sandbox/gh", "${HOME}/.config/sigrid"]
endpoints = [
    "github.com",
    "api.github.com",
    "cortecs.ai",
    "api.cortecs.ai",
    "api.exa.ai",
    "api.mistral.ai",
    "console.mistral.ai",
    "chat.mistral.ai",
]

[[apps]]
name = "vibe-acp"
browser = true
env.BROWSER = "${HOME}/.local/share/sandbox/runtimes/browser/xdg-open"
